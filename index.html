<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>+19 LORENZO</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Impact, "Arial Black", "Noto Sans", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
    overscroll-behavior: none;
  }

  /* SCEMO CHI LEGGE */
  #bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 1;
    background: #222;
    overflow: hidden;
  }
  #bg img {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;            
    opacity: 0;
    transition: opacity 0.12s linear;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  #bg img.on { opacity: 1; }


  #crawlWrap {
    position: fixed;
    inset: 0;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
    perspective: 70vh;
    perspective-origin: 50% 0%;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 100%);
  }
  #crawl {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    transform-origin: 50% 100%;
    transform: rotateX(45deg);
  }
  #scroller {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    text-align: center;
    will-change: transform;
    transform: translateY(100vh);
  }
  .line {
    font-weight: 900;
    font-size: clamp(1.8rem, min(8vw, 12vh), 6rem);
    line-height: 1.12;
    padding: 0 4vw;
    margin-bottom: 0.55em;
    letter-spacing: 0.02em;
    overflow-wrap: anywhere;
    -webkit-text-stroke: 0.13em #000;
    paint-order: stroke fill;
    text-shadow:
      0 0 0.1em #000,
      0.06em 0.06em 0 #000,
      -0.06em 0.06em 0 #000,
      0 0.1em 0.18em rgba(0,0,0,.9);
  }

  /* ---------- Cazzo cerchi ---------- */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* ---------- Ghay ---------- */
  #title {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 30;
    width: 96vw;
    margin: 0;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    font-weight: 900;
    font-size: min(15vw, 22vh);
    line-height: 1.02;
    color: #fff;
    white-space: normal;
    text-wrap: balance;
    -webkit-text-stroke: 0.09em #000;
    paint-order: stroke fill;
    text-shadow:
      0 0 0.12em #000,
      0.05em 0.05em 0 #000,
      -0.05em 0.05em 0 #000,
      0.05em -0.05em 0 #000,
      -0.05em -0.05em 0 #000,
      0 0.12em 0.25em #000,
      0 0 0.5em rgba(0,0,0,.8);
  }
  #title span {
    display: inline-block;
    animation:
      blink 0.7s steps(1, end) infinite,
      pulse 0.9s ease-in-out infinite alternate;
  }
  @keyframes blink {
    0%, 55%  { opacity: 1; }
    56%, 100% { opacity: 0.08; }
  }
  @keyframes pulse {
    from { transform: scale(0.95); }
    to   { transform: scale(1.07); }
  }

  /* ---------- PULSANTE DONA ---------- */
  #dona {
    position: fixed;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: min(62vw, 300px);
    padding: 0.7em 1em;
    font-family: Impact, "Arial Black", "Noto Sans", sans-serif;
    font-weight: 900;
    font-size: clamp(13px, 3.4vw, 18px);
    line-height: 1.1;
    text-align: center;
    overflow-wrap: anywhere;
    border: 0.18em dashed #000;
    border-radius: 14px;
    cursor: pointer;
    background: #ff0000;
    color: #ffff00;
    -webkit-text-stroke: 0.04em #000;
    paint-order: stroke fill;
    text-shadow: 0.06em 0.06em 0 #000;
    box-shadow: 0 0 22px 8px #ff0, 0 0 50px 18px #f00;
    animation: btnBlink 0.45s steps(1, end) infinite;
    touch-action: manipulation;
  }
  #dona.grow {
    max-width: none;
    padding: 0.4em 0.6em;
  }
  #dona.full {
    left: 0; top: 0; right: 0; bottom: 0;
    width: auto; height: auto;
    border-radius: 0;
  }
  @keyframes btnBlink {
    0%, 49%   { background: #ff0000; color: #ffff00; box-shadow: 0 0 22px 8px #ff0, 0 0 50px 18px #f00; }
    50%, 100% { background: #ffee00; color: #ff0000; box-shadow: 0 0 30px 12px #f00, 0 0 70px 26px #ff0; }
  }

  /* ---------- SCHERMATA INIZIALE NERA ---------- */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vw;
    background: #000;
    color: #fff;
    text-align: center;
    font-family: Impact, "Arial Black", "Noto Sans", sans-serif;
    font-weight: 900;
    font-size: clamp(1.6rem, min(7vw, 12vh), 5rem);
    line-height: 1.15;
    cursor: pointer;
  }
  #intro.gone { display: none; }

  @media (prefers-reduced-motion: reduce) {
    /* il sito è volutamente caotico: nessuna riduzione applicata */
  }
</style>
</head>
<body>

<div id="intro">clicca qui per scaricare virus</div>

<div id="bg">
  <img id="bg0" src="sfondo1.jpg" alt="" draggable="false">
  <img id="bg1" src="sfondo2.jpg" alt="" draggable="false">
  <img id="bg2" src="sfondo3.jpg" alt="" draggable="false">
</div>

<div id="crawlWrap" aria-hidden="true">
  <div id="crawl">
    <div id="scroller"></div>
  </div>
</div>

<canvas id="confetti"></canvas>

<h1 id="title"><span>+19 LORENZO</span></h1>

<button id="dona" type="button">dona ora per supportare lo sviluppatore</button>

<script>
(function () {
  "use strict";
/*  si è veramente il mio revolut  */
  const YOUTUBE_LINK = "http://revolut.me/francesco_sdp";

  const GROW_TIME = 25000;
  const GROW_DELAY = 5000;

  let started = false; // diventa true al primo click sulla schermata nera


  const BG_FILES = ["sfondo1.jpg", "sfondo2.jpg", "sfondo3.jpg"];
  BG_FILES.forEach(function (src) { var im = new Image(); im.src = src; }); // precaricamento

  const bgImgs = [
    document.getElementById("bg0"),
    document.getElementById("bg1"),
    document.getElementById("bg2")
  ];
  let bgIndex = 0;
  function showBg(i) {
    for (let k = 0; k < bgImgs.length; k++) {
      bgImgs[k].classList.toggle("on", k === i);
    }
  }
  showBg(0);
  function startBgCycle() {
    setInterval(function () {
      bgIndex = (bgIndex + 1) % BG_FILES.length;
      showBg(bgIndex);
    }, 2000);
  }


  const LANGS = [
    "BUON COMPLEANNO", "HAPPY BIRTHDAY", "FELIZ CUMPLEAÑOS", "JOYEUX ANNIVERSAIRE",
    "ALLES GUTE ZUM GEBURTSTAG", "FELIZ ANIVERSÁRIO", "生日快乐", "お誕生日おめでとう",
    "생일 축하해", "С ДНЁМ РОЖДЕНИЯ", "عيد ميلاد سعيد", "GELUKKIGE VERJAARDAG",
    "GRATTIS PÅ FÖDELSEDAGEN", "TANTI AUGURI", "TILLYKKE MED FØDSELSDAGEN",
    "GRATULERER MED DAGEN", "ONNEA SYNTYMÄPÄIVÄNÄ", "WSZYSTKIEGO NAJLEPSZEGO Z OKAZJI URODZIN",
    "ΧΡΟΝΙΑ ΠΟΛΛΑ", "DOĞUM GÜNÜN KUTLU OLSUN", "जन्मदिन मुबारक हो", "יום הולדת שמח",
    "VŠECHNO NEJLEPŠÍ K NAROZENINÁM", "BOLDOG SZÜLETÉSNAPOT", "LA MULȚI ANI",
    "З ДНЕМ НАРОДЖЕННЯ", "สุขสันต์วันเกิด", "CHÚC MỪNG SINH NHẬT", "SELAMAT ULANG TAHUN",
    "HERI ZA KUZALIWA", "FELIX DIES NATALIS", "MOLTS ANYS", "LÁ BREITHE SONA DUIT",
    "BONAN NASKIĜTAGON", "MALIGAYANG KAARAWAN", "تولدت مبارک", "TIL HAMINGJU MEÐ DAGINN",
    "PEN-BLWYDD HAPUS", "SRETAN ROĐENDAN", "LĀ HĀNAU HOʻOLAULEA"
  ];

  // mescola una volta
  const order = LANGS.slice();
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }

  const scroller = document.getElementById("scroller");
  const wrap = document.getElementById("crawlWrap");

  function makeBlock() {
    const block = document.createElement("div");
    block.className = "block";
    block.style.paddingBottom = "0.5em";
    let hue = Math.random() * 360;
    order.forEach(function (txt) {
      hue = (hue + 137.5) % 360; // angolo aureo: colori sempre diversi
      const d = document.createElement("div");
      d.className = "line";
      d.setAttribute("dir", "auto");
      d.textContent = txt;
      d.style.color = "hsl(" + Math.round(hue) + ",100%," + (55 + Math.round(Math.random() * 12)) + "%)";
      block.appendChild(d);
    });
    return block;
  }

  let introAnim = null, loopAnim = null, resizeTimer = null;

  function startCrawl() {
    if (introAnim) introAnim.cancel();
    if (loopAnim) loopAnim.cancel();
    scroller.innerHTML = "";
    scroller.appendChild(makeBlock());
    scroller.appendChild(makeBlock());

    const H = wrap.clientHeight || window.innerHeight;
    const blockH = scroller.firstChild.offsetHeight;
    const speed = Math.max(24, H * 0.04); // px/secondo: MOLTO lento

    scroller.style.transform = "translateY(" + H + "px)";

    // entrata dal basso
    introAnim = scroller.animate(
      [{ transform: "translateY(" + H + "px)" }, { transform: "translateY(0px)" }],
      { duration: (H / speed) * 1000, easing: "linear", fill: "forwards" }
    );
    introAnim.onfinish = function () {
      // ciclo infinito senza buchi (due blocchi identici)
      loopAnim = scroller.animate(
        [{ transform: "translateY(0px)" }, { transform: "translateY(-" + blockH + "px)" }],
        { duration: (blockH / speed) * 1000, easing: "linear", iterations: Infinity }
      );
      introAnim.cancel();
    };
  }

  window.addEventListener("resize", function () {
    if (!started) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(startCrawl, 250);
  });
  window.addEventListener("orientationchange", function () {
    if (!started) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(startCrawl, 400);
  });


  const music = new Audio("feliz-trash.mp3");
  music.loop = true;
  music.preload = "auto";
  music.volume = 1;
  music.addEventListener("ended", function () { music.currentTime = 0; music.play().catch(function () {}); });

  let musicStarted = false;
  function startMusic() {
    if (musicStarted) return;
    const p = music.play();
    if (p && p.then) {
      p.then(function () { musicStarted = true; }).catch(function () { /* riproverà al prossimo gesto */ });
    } else {
      musicStarted = true;
    }
  }
  // la musica parte al primo click sulla schermata nera

  const clickBase = new Audio("click-trash.mp3");
  clickBase.preload = "auto";
  let pendingClickAt = 0;

  function playClick() {
    // nuova istanza ad ogni click: i suoni si sovrappongono
    const a = clickBase.cloneNode(true);
    a.volume = 1;
    const p = a.play();
    if (p && p.catch) {
      p.catch(function () { pendingClickAt = performance.now(); });
    }
  }


  const cv = document.getElementById("confetti");
  const ctx = cv.getContext("2d");
  let W = 0, H2 = 0, dpr = 1;

  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H2 = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H2 * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  const MAX_PARTICLES = 4500;
  const particles = [];
  const COLORS = ["#ff0040", "#ffee00", "#00e5ff", "#39ff14", "#ff00ff", "#ff7a00", "#ffffff", "#7a00ff", "#00ff9c", "#ff69b4"];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function makeParticle(x, y, vx, vy, burst) {
    const shape = Math.random();
    return {
      x: x, y: y, vx: vx, vy: vy,
      w: rand(6, 17), h: rand(4, 11),
      rot: rand(0, Math.PI * 2),
      vr: rand(-0.35, 0.35),
      tilt: rand(0, Math.PI * 2),
      vt: rand(0.05, 0.3),
      sway: rand(0.2, 1.4),
      swayPh: rand(0, Math.PI * 2),
      color: pick(COLORS),
      shape: shape < 0.55 ? 0 : (shape < 0.8 ? 1 : 2), // rettangolo / cerchio / stella filante
      burst: burst
    };
  }

  function spawnRain(n, anywhere) {
    for (let i = 0; i < n; i++) {
      if (particles.length >= MAX_PARTICLES) return;
      const x = rand(-20, W + 20);
      const y = anywhere ? rand(-20, H2) : rand(-40, -8);
      particles.push(makeParticle(x, y, rand(-1, 1), rand(1.2, 5.2), false));
    }
  }
  spawnRain(Math.floor(W / 3), true); // riempimento iniziale

  let combo = 0, lastClick = 0;

  function burstAt(x, y) {
    const now = performance.now();
    combo = (now - lastClick < 1600) ? Math.min(combo + 1, 14) : 1;
    lastClick = now;

    const n = 320 + combo * 90;
    for (let i = 0; i < n; i++) {
      if (particles.length >= MAX_PARTICLES) break;
      const ang = rand(0, Math.PI * 2);
      const sp = rand(3, 20 + combo * 1.6);
      particles.push(makeParticle(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp - rand(0, 6), true));
    }
    // cannoni ai lati
    const cannons = 60 + combo * 20;
    for (let i = 0; i < cannons; i++) {
      if (particles.length >= MAX_PARTICLES) break;
      const left = i % 2 === 0;
      particles.push(makeParticle(left ? 0 : W, H2, (left ? 1 : -1) * rand(4, 16), -rand(10, 26 + combo), true));
    }
    // doccia extra dall'alto
    spawnRain(80 + combo * 30, false);
    for (let i = 0; i < 60 + combo * 20; i++) {
      if (particles.length >= MAX_PARTICLES) break;
      particles.push(makeParticle(rand(0, W), rand(-H2 * 0.6, -10), rand(-2, 2), rand(3, 9), false));
    }
  }

  let lastT = performance.now(), rainAcc = 0;

  function frame(t) {
    let dt = (t - lastT) / 16.667;
    lastT = t;
    if (!(dt > 0)) dt = 1;
    if (dt > 3) dt = 3;

    // pioggia continua
    rainAcc += (1.3 + W / 450) * dt;
    const spawnN = Math.floor(rainAcc);
    rainAcc -= spawnN;
    spawnRain(spawnN, false);

    ctx.clearRect(0, 0, W, H2);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      if (p.burst) {
        const drag = Math.pow(0.975, dt);
        p.vx *= drag;
        p.vy = p.vy * drag + 0.22 * dt;
        if (p.vy > 7.5) p.vy = 7.5 + (p.vy - 7.5) * 0.9;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      } else {
        p.swayPh += 0.04 * dt;
        p.x += (p.vx + Math.sin(p.swayPh) * p.sway * 2) * dt;
        p.y += p.vy * dt;
      }
      p.rot += p.vr * dt;
      p.tilt += p.vt * dt;

      if (p.y > H2 + 40 || p.x < -140 || p.x > W + 140) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
        continue;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      const flip = Math.cos(p.tilt);
      if (p.shape === 0) {
        ctx.scale(1, flip);
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else if (p.shape === 1) {
        ctx.scale(1, Math.abs(flip) * 0.9 + 0.1);
        ctx.beginPath();
        ctx.arc(0, 0, p.h * 0.6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.scale(1, flip);
        ctx.fillRect(-p.w * 1.2, -1.5, p.w * 2.4, 3);
      }
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);


  window.addEventListener("pointerdown", function (e) {
    startSite();
    startMusic();
    playClick();
    burstAt(e.clientX, e.clientY);
  }, { passive: true });

  // Fallback per browser (es. iOS) che accettano l'audio solo su touchend/click
  function retryAudio() {
    if (!started) return;
    startMusic();
    if (pendingClickAt && performance.now() - pendingClickAt < 900) {
      pendingClickAt = 0;
      const a = clickBase.cloneNode(true);
      a.play().catch(function () {});
    }
  }
  window.addEventListener("touchend", retryAudio, { passive: true });
  window.addEventListener("click", retryAudio, { passive: true });
  window.addEventListener("keydown", function () { if (started) startMusic(); });


  const btn = document.getElementById("dona");
  let clickedEarly = false;
  let growing = false;

  btn.addEventListener("click", function () {
    if (!growing) clickedEarly = true; // cliccato entro i primi 5s: niente crescita
    // piccolo ritardo perché il suono del click parta prima dell'apertura
    setTimeout(function () {
      const w = window.open(YOUTUBE_LINK, "_blank", "noopener");
      if (!w) window.location.href = YOUTUBE_LINK;
    }, 120);
  });

  function lerp(a, b, p) { return a + (b - a) * p; }

  function startGrowth() {
    if (clickedEarly) return;
    growing = true;

    const r = btn.getBoundingClientRect();
    const cs = getComputedStyle(btn);
    const w0 = r.width, h0 = r.height;
    const fs0 = parseFloat(cs.fontSize);
    const rad0 = parseFloat(cs.borderTopLeftRadius) || 14;
    const right0 = window.innerWidth - r.right;
    const bottom0 = window.innerHeight - r.bottom;

    btn.classList.add("grow");
    btn.style.width = w0 + "px";
    btn.style.height = h0 + "px";
    btn.style.right = right0 + "px";
    btn.style.bottom = bottom0 + "px";

    const t0 = performance.now();

    function step(now) {
      const p = Math.min(1, (now - t0) / GROW_TIME); // crescita lineare, lenta e continua
      const VW = document.documentElement.clientWidth || window.innerWidth;
      const VH = window.innerHeight;
      const fs1 = Math.min(VW * 0.11, VH * 0.2);

      if (p >= 1) {
        btn.style.width = "";
        btn.style.height = "";
        btn.style.right = "";
        btn.style.bottom = "";
        btn.classList.add("full");
        btn.style.fontSize = fs1 + "px";
        // dopo la fine continua ad adattarsi al ridimensionamento
        window.addEventListener("resize", function () {
          const a = document.documentElement.clientWidth || window.innerWidth;
          const b = window.innerHeight;
          btn.style.fontSize = Math.min(a * 0.11, b * 0.2) + "px";
        });
        return;
      }

      btn.style.width = lerp(w0, VW, p) + "px";
      btn.style.height = lerp(h0, VH, p) + "px";
      btn.style.right = lerp(right0, 0, p) + "px";
      btn.style.bottom = lerp(bottom0, 0, p) + "px";
      btn.style.fontSize = lerp(fs0, fs1, p) + "px";
      btn.style.borderRadius = lerp(rad0, 0, p) + "px";
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // =====================================================
  //  AVVIO DEL SITO AL PRIMO CLICK
  // =====================================================
  const intro = document.getElementById("intro");
  function startSite() {
    if (started) return;
    started = true;
    intro.classList.add("gone");
    startBgCycle();
    startCrawl();
    setTimeout(startGrowth, GROW_DELAY); // i 5 secondi partono ora
  }
  intro.addEventListener("click", function () { startSite(); startMusic(); });
})();
</script>
</body>
</html>
